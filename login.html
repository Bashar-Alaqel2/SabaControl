<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | SabaPost</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="core/main.css">
    <link rel="stylesheet" href="core/login.css">
</head>

<body class="login-page">

    <div class="login-wrapper">
        <div class="login-card">
            <div class="brand">
                <img src="images/sabalog.png" alt="SabaPost Logo"> <span>SabaPost</span>
            </div>
            <h3 id="formTitle">بوابة وصول المشرفين</h3>

            <form id="authForm">
                <div class="form-group" id="nameGroup" style="display: none;">
                    <label>الاسم الكامل</label>
                    <input type="text" id="fullName" placeholder="مثال: أحمد محمد">
                </div>

                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="email" required placeholder="user@sabapost.com" dir="ltr">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password" required placeholder="••••••••" dir="ltr">
                </div>

                <button type="submit" class="btn btn-primary login-btn" id="submitBtn">
                    <i class="fa-solid fa-right-to-bracket"></i> دخول للنظام
                </button>

                <div id="errorMsg" class="error-msg"><i class="fa-solid fa-triangle-exclamation"></i> حدث خطأ، يرجى المحاولة.</div>
                <div id="successMsg" class="success-msg"><i class="fa-solid fa-circle-check"></i> تم إنشاء الحساب بنجاح! جاري الدخول...</div>
            </form>

            <a id="toggleModeBtn" class="toggle-link" onclick="Auth.toggleMode()">ليس لديك حساب؟ تسجيل مستخدم جديد</a>
        </div>
    </div>

    <script src="core/db.js"></script>
    <script src="core/auth.js"></script>
</body>
</html>
