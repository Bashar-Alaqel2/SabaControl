<div class="load-stats-here"></div>

<div class="dashboard-wrapper" style="display: flex; flex-direction: column; gap: 30px;">
    
    <div class="dashboard-top-row" style="display: grid; grid-template-columns: 1.8fr 1.2fr; gap: 30px; align-items: start;">
        
        <!-- مركز المراقبة الزجاجي -->
        <div class="center-panel">
            <div class="premium-glass-card h-100">
                <div class="flex-between mb-4">
                    <div>
                        <h3 class="mb-1" style="font-size: 1.4rem; font-weight: 900; color: #fff;">
                            <i class="fa-solid fa-desktop text-primary me-2"></i> مركز مراقبة الأسطول
                        </h3>
                        <p class="text-muted small">نظرة عامة سريعة على حالة الشاشات المتصلة حالياً</p>
                    </div>
                    <button class="neon-btn" style="width: auto; padding: 0 20px;" onclick="loadModule('screens')">إدارة شاملة</button>
                </div>
                
                <div class="table-responsive">
                    <table class="table align-middle w-100 text-center">
                        <thead>
                            <tr>
                                <th class="text-start ps-4">الشاشة</th>
                                <th>حالة الاتصال</th>
                                <th>الترخيص</th>
                            </tr>
                        </thead>
                        <tbody id="screensList">
                            <!-- جاري التحميل... -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- مركز تحكم بث الأخبار -->
        <div class="side-panel">
            <div class="premium-glass-card h-100" id="adminDashboardTicker" style="display: none; border-top: 4px solid #f59e0b;">
                <div class="flex-between mb-4">
                    <h3 class="mb-0" style="font-size: 1.3rem; font-weight: 900; color: #fff;">
                        <i class="fa-solid fa-bolt-lightning text-warning me-2"></i> بث الأخبار العاجلة
                    </h3>
                    <label class="toggle-switch">
                        <input type="checkbox" id="tickerToggle">
                        <span class="slider"></span>
                    </label>
                </div>
                
                <div class="card-body p-0">
                    <div class="form-group mb-4">
                        <label class="small fw-bold text-muted mb-2">🎯 استهداف البث:</label>
                        <select id="tickerTargetScreen" onchange="DashboardModule.loadSpecificScreenTicker()" class="premium-input w-100" style="background: rgba(0,0,0,0.3);">
                            <option value="all">البث للجميع (Global Sync)</option>
                        </select>
                    </div>

                    <div class="form-group mb-4">
                        <textarea id="newsInput" rows="3" class="premium-input w-100" placeholder="اكتب رسالة البث هنا..." style="font-size: 15px; resize: none; background: rgba(0,0,0,0.3);"></textarea>
                    </div>

                    <div class="settings-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px;">
                        <div class="form-group text-center">
                            <label class="small d-block mb-2 fw-bold text-muted">الخلفية</label>
                            <input type="color" id="tickerBgColor" value="#000000" class="premium-input w-100 p-1" style="height: 50px; cursor: pointer;">
                        </div>
                        <div class="form-group text-center">
                            <label class="small d-block mb-2 fw-bold text-muted">لون الخط</label>
                            <input type="color" id="tickerTextColor" value="#ffffff" class="premium-input w-100 p-1" style="height: 50px; cursor: pointer;">
                        </div>
                        <div class="form-group" style="grid-column: span 2;">
                            <label class="small fw-bold text-muted mb-2">سرعة الحركة</label>
                            <input type="range" id="tickerSpeed" value="50" min="10" max="200" class="form-range" style="accent-color: var(--primary);">
                        </div>
                    </div>

                    <button class="neon-btn w-100 py-3" style="background: #f59e0b; font-weight: 900; font-size: 16px; border: none;" onclick="DashboardModule.updateAdvancedTickerDashboard()">
                        <i class="fa-solid fa-satellite-dish me-2"></i> إرسال البث الفوري
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- سجل الأمان والمساءلة -->
    <div class="dashboard-bottom-row">
        <div class="premium-glass-card" id="tickerHistoryCard" style="display:none;">
            <div class="flex-between mb-4">
                <h5 class="mb-0" style="font-weight: 900; font-size: 1.4rem; color: #fff;">
                    <i class="fa-solid fa-clock-rotate-left me-2 text-primary"></i> سجل عمليات البث (نظام المساءلة)
                </h5>
                <button class="neon-btn" style="width: auto; padding: 0 20px;" onclick="DashboardModule.fetchTickerHistory()">
                    <i class="fa-solid fa-rotate"></i> تحديث السجلات
                </button>
            </div>
            <div class="table-responsive">
                <table class="table align-middle text-center w-100">
                    <thead>
                        <tr>
                            <th class="text-start ps-4">الرسالة</th>
                            <th>بواسطة</th>
                            <th>التوقيت</th>
                            <th>الشاشة</th>
                            <th>إدارة</th>
                        </tr>
                    </thead>
                    <tbody id="tickerHistoryBody">
                        <!-- جاري التحميل... -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
