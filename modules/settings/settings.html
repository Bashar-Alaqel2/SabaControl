<div class="dashboard-grid">
    
    <!-- القسم الأوسط: الإعدادات الرئيسية -->
    <div class="center-panel">
        
        <!-- هوية النظام -->
        <div class="glass-card">
            <h3 class="section-title">
                <i class="fa-solid fa-palette"></i> هوية ومظهر لوحة التحكم
            </h3>
            
            <div class="settings-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group" style="grid-column: span 2;">
                    <label class="small fw-bold mb-2">اسم النظام (Branding)</label>
                    <input type="text" id="systemName" value="SabaPost" class="form-control premium-input" placeholder="مثلاً: SabaPost">
                </div>

                <div class="form-group">
                    <label class="small fw-bold mb-2">اللون الرئيسي</label>
                    <div class="color-picker-wrapper">
                        <div class="color-circle" id="primaryColorCircle">
                            <input type="color" id="primaryColor" value="#940f31">
                        </div>
                        <input type="text" id="primaryColorText" value="#940f31" class="form-control premium-input border-0 bg-transparent p-0" readonly style="width: 80px;">
                    </div>
                </div>

                <div class="form-group">
                    <label class="small fw-bold mb-2">لون القائمة الجانبية</label>
                    <div class="color-picker-wrapper">
                        <div class="color-circle" id="sidebarColorCircle">
                            <input type="color" id="sidebarColor" value="#5c041c">
                        </div>
                        <input type="text" id="sidebarColorText" value="#5c041c" class="form-control premium-input border-0 bg-transparent p-0" readonly style="width: 80px;">
                    </div>
                </div>

                <div class="form-group">
                    <label class="small fw-bold mb-2">خلفية النظام</label>
                    <div class="color-picker-wrapper">
                        <div class="color-circle" id="bgColorCircle">
                            <input type="color" id="bgColor" value="#f4f7fa">
                        </div>
                        <input type="text" id="bgColorText" value="#f4f7fa" class="form-control premium-input border-0 bg-transparent p-0" readonly style="width: 80px;">
                    </div>
                </div>

                <div class="form-group">
                    <label class="small fw-bold mb-2">خلفية الكروت</label>
                    <div class="color-picker-wrapper">
                        <div class="color-circle" id="cardBgColorCircle">
                            <input type="color" id="cardBgColor" value="#ffffff">
                        </div>
                        <input type="text" id="cardBgColorText" value="#ffffff" class="form-control premium-input border-0 bg-transparent p-0" readonly style="width: 80px;">
                    </div>
                </div>

                <div class="form-group" style="grid-column: span 2;">
                    <label class="small fw-bold mb-2">لون النصوص العام</label>
                    <div class="color-picker-wrapper">
                        <div class="color-circle" id="textColorCircle">
                            <input type="color" id="textColor" value="#4a5568">
                        </div>
                        <input type="text" id="textColorText" value="#4a5568" class="form-control premium-input border-0 bg-transparent p-0" readonly style="width: 80px;">
                    </div>
                </div>
            </div>

            <button class="btn btn-save mt-4" onclick="saveThemeSettings()">
                <i class="fa-solid fa-wand-magic-sparkles me-2"></i> حفظ وتطبيق التصميم الجديد
            </button>
        </div>

        <!-- إعدادات شريط الأخبار -->
        <div class="glass-card">
            <div class="flex-between mb-4">
                <h3 class="section-title mb-0">
                    <i class="fa-solid fa-satellite-dish text-warning"></i> شريط الأخبار العاجلة
                </h3>
                <label class="toggle-switch">
                    <input type="checkbox" id="settingsTickerToggle" onchange="toggleTickerVisibility('settings')">
                    <span class="premium-switch"></span>
                </label>
            </div>

            <div class="form-group mb-4">
                <label class="small fw-bold mb-2">محتوى الخبر العاجل</label>
                <textarea id="settingsNewsInput" rows="2" class="form-control premium-input" placeholder="اكتب النص الذي سيظهر على شاشات العرض..."></textarea>
            </div>

            <div class="settings-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
                <div class="form-group">
                    <label class="small fw-bold mb-2">لون الخلفية</label>
                    <input type="color" id="settingsTickerBgColor" value="#000000" class="form-control premium-input p-1" style="height: 45px;">
                </div>
                <div class="form-group">
                    <label class="small fw-bold mb-2">لون الخط</label>
                    <input type="color" id="settingsTickerTextColor" value="#ffffff" class="form-control premium-input p-1" style="height: 45px;">
                </div>
                <div class="form-group">
                    <label class="small fw-bold mb-2">السرعة</label>
                    <input type="number" id="settingsTickerSpeed" value="50" min="10" max="200" class="form-control premium-input">
                </div>
            </div>

            <button class="btn btn-warning w-100 mt-3 fw-bold py-3 rounded-4 shadow-sm" onclick="saveAdvancedTicker()">
                <i class="fa-solid fa-paper-plane me-2"></i> بث التحديثات للشاشات فوراً
            </button>
        </div>

        <!-- إدارة المستخدمين (للمدير فقط) -->
        <div class="glass-card" id="adminUsersSection" style="display: none;">
            <div class="flex-between mb-4">
                <h3 class="section-title mb-0">
                    <i class="fa-solid fa-user-shield text-success"></i> إدارة طاقم العمل
                </h3>
                <button class="btn btn-light btn-sm rounded-pill px-3 fw-bold" onclick="fetchUsersList()">
                    <i class="fa-solid fa-rotate-right me-1"></i> تحديث القائمة
                </button>
            </div>
            
            <div class="table-responsive">
                <table class="premium-table w-100">
                    <thead>
                        <tr>
                            <th class="ps-3">الموظف</th>
                            <th>البريد</th>
                            <th>الصلاحية</th>
                            <th>الحالة</th>
                            <th class="text-center">إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="usersListTable">
                        <!-- مدمج عبر JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- القائمة الجانبية: إعدادات إضافية -->
    <div class="side-panel">
        
        <!-- شعار الطوارئ -->
        <div class="glass-card sticky-card">
            <h3 class="section-title">
                <i class="fa-regular fa-image text-danger"></i> شعار النظام (Brand)
            </h3>
            
            <div class="preview-container mb-4" style="height: 180px; border: 2px dashed rgba(0,0,0,0.1); border-radius: 20px; background: rgba(255,255,255,0.4);">
                <img id="currentFallbackPreview" src="" style="display: none; max-width: 80%; max-height: 80%; object-fit: contain; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));">
                <div id="fallbackPlaceholder" class="text-center">
                    <i class="fa-solid fa-cloud-arrow-up mb-2" style="font-size: 40px; color: #ccc;"></i>
                    <p class="small text-muted mb-0">ارفع شعار الشاشة الافتراضي</p>
                </div>
            </div>

            <input type="file" id="fallbackInput" accept="image/*" class="form-control premium-input mb-3" style="font-size: 12px;">
            
            <div class="d-flex gap-2">
                <button class="btn btn-primary flex-fill py-3 rounded-4" onclick="uploadFallbackImage()">
                    <i class="fa-solid fa-upload"></i>
                </button>
                <button class="btn btn-danger px-4 py-3 rounded-4" onclick="deleteFallbackImage()">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            </div>
            <div id="fallbackStatus" class="status-msg small mt-2"></div>

            <hr class="my-4" style="opacity: 0.1;">

            <!-- تعريف الجهاز -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h6 class="fw-bold mb-0" style="font-size: 0.9rem;">معرف الجهاز (Device ID)</h6>
                    <p class="text-muted small mb-0">إظهار كود التعريف على الشاشات</p>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="showDeviceIdToggle" onchange="autoSaveSystemPreferences()">
                    <span class="premium-switch"></span>
                </label>
            </div>
        </div>

        <!-- الجلسات النشطة -->
        <div class="glass-card" id="adminSessionsSection" style="display: none;">
            <div class="flex-between mb-4">
                <h3 class="section-title mb-0" style="font-size: 1rem;">
                    <i class="fa-solid fa-tower-broadcast text-danger"></i> المتصلون الآن
                </h3>
            </div>
            
            <div class="table-responsive">
                <table class="premium-table w-100" style="font-size: 12px;">
                    <tbody id="activeSessionsTable">
                        <tr><td colspan="5" class="text-center p-4 text-muted small">جاري الفحص...</td></tr>
                    </tbody>
                </table>
            </div>

            <button class="btn btn-outline-danger btn-sm w-100 mt-3 rounded-pill border-0" onclick="fetchAllSessions()">
                <i class="fa-solid fa-sync me-1"></i> تحديث الجلسات
            </button>
        </div>

    </div>
</div>
