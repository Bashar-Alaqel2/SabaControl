<!-- قسم الإحصائيات (يتم تحميله ديناميكياً) -->
<div class="load-stats-here"></div>

<!-- التحكم المركزي بالشاشات (Grand Layout) -->
<div class="mt-4">
    <div class="flex-between mb-5 flex-wrap gap-4">
        <div>
            <h2 class="section-title mb-2" style="font-size: 2rem; font-weight: 900; letter-spacing: -1px;">
                <i class="fa-solid fa-server text-primary"></i> التحكم بالأسطول
            </h2>
            <p class="text-muted" style="font-size: 14px;">إدارة الشاشات والارتباطات اللحظية عبر البروتوكول السحابي</p>
        </div>
        <div class="d-flex gap-3">
            <button class="neon-btn" style="width: auto; padding: 0 25px; gap: 10px;" onclick="ScreensModule.fetchAndRender()">
                <i class="fa-solid fa-rotate-right"></i> تحديث الحالة
            </button>
            <button class="neon-btn" style="width: auto; padding: 0 25px; gap: 10px; background: var(--primary); box-shadow: 0 0 20px var(--primary-glow);" onclick="ScreensModule.openModal()">
                <i class="fa-solid fa-plus"></i> إضافة شاشة ذكية
            </button>
        </div>
    </div>

    <!-- حاوية صفوف البطاقات المتطورة -->
    <div id="detailedScreensList" class="screens-card-container">
        <!-- جاري تحميل البيانات... -->
        <div class="text-center p-5">
            <i class="fa-solid fa-circle-notch fa-spin fa-2x text-primary"></i>
            <p class="mt-3 text-muted">جاري سحب بيانات الشاشات...</p>
        </div>
    </div>
</div>

<!-- مودال إضافة شاشة (Glass Effect) -->
<div id="addScreenModal" class="modal-overlay"
    style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center;">
    <div class="modal-glass p-4 shadow-lg" style="width: 100%; max-width: 450px; background: white;">
        <div class="flex-between mb-4">
            <h4 class="mb-0 fw-bold"><i class="fa-solid fa-display text-primary me-2"></i> ربط شاشة جديدة</h4>
            <button class="btn-close" onclick="ScreensModule.closeModal()"
                style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">&times;</button>
        </div>

        <div class="form-group mb-3">
            <label class="small fw-bold mb-2">معرف الجهاز (Device ID)</label>
            <input type="text" id="newScreenId" class="form-control premium-input" placeholder="مثلاً: SN-9928-AX">
            <p class="text-muted small mt-1">يظهر هذا الكود على الشاشة عند تشغيل تطبيق العرض.</p>
        </div>

        <div class="form-group mb-4">
            <label class="small fw-bold mb-2">اسم الشاشة (للمكان)</label>
            <input type="text" id="newScreenName" class="form-control premium-input"
                placeholder="مثلاً: شاشة الاستقبال الرئيسية">
        </div>

        <button class="btn btn-save py-3" onclick="ScreensModule.submitNewScreen()">
            <i class="fa-solid fa-link me-2"></i> تأكيد الربط والبث
        </button>
    </div>
</div>
