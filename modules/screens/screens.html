<!-- قسم الإحصائيات (يتم تحميله ديناميكياً) -->
<div class="load-stats-here"></div>

<!-- التحكم المركزي بالشاشات (Grand Layout) -->
<div class="mt-4">
    <div class="flex-between mb-5 flex-wrap gap-4">
        <div>
            <h2 class="section-title mb-2" style="font-size: 2rem; font-weight: 900; letter-spacing: -1px; color: #fff;">
                <i class="fa-solid fa-server text-primary"></i> التحكم بالأسطول
            </h2>
            <p class="text-muted" style="font-size: 14px;">إدارة الشاشات والارتباطات اللحظية عبر البروتوكول السحابي</p>
        </div>
        <div class="d-flex gap-3">
            <button class="neon-btn" style="width: auto; padding: 0 25px; gap: 10px;" onclick="ScreensModule.fetchAndRender()">
                <i class="fa-solid fa-rotate-right"></i> تحديث الحالة
            </button>
            <button class="neon-btn" style="width: auto; padding: 0 25px; gap: 10px; background: var(--primary); box-shadow: 0 0 20px var(--primary-glow);" onclick="ScreensModule.openModal()">
                <i class="fa-solid fa-plus"></i> إضافة شاشة ذكية
            </button>
        </div>
    </div>

    <!-- حاوية صفوف البطاقات المتطورة -->
    <div id="detailedScreensList" class="screens-card-container">
        <!-- جاري تحميل البيانات... -->
        <div class="text-center p-5">
            <i class="fa-solid fa-circle-notch fa-spin fa-2x text-primary" style="filter: drop-shadow(0 0 10px var(--primary-glow));"></i>
            <p class="mt-3 text-muted fw-bold">جاري سحب بيانات الشاشات المباشرة...</p>
        </div>
    </div>
</div>

<!-- مودال إضافة شاشة (Glass Effect) -->
<div id="addScreenModal" class="modal-overlay"
    style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.8); z-index: 1000; align-items: center; justify-content: center;">
    
    <div class="premium-glass-card" style="width: 100%; max-width: 450px; margin: 20px; padding: 40px; box-sizing: border-box;">
        <div class="flex-between mb-4 pb-3" style="border-bottom: 1px solid rgba(255,255,255,0.05);">
            <h4 class="mb-0" style="font-weight: 900; color: #fff;"><i class="fa-solid fa-display text-primary me-2"></i> ربط شاشة جديدة</h4>
            <button onclick="ScreensModule.closeModal()"
                style="background: rgba(255,255,255,0.1); border: none; font-size: 1.2rem; cursor: pointer; color: #fff; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease;">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="form-group mb-4">
            <label class="small fw-bold text-muted mb-2">معرف الجهاز (Device ID)</label>
            <input type="text" id="newScreenId" class="premium-input" placeholder="مثلاً: SN-9928-AX">
            <p style="color: rgba(255,255,255,0.4); font-size: 12px; margin-top: 8px;">يظهر هذا الكود أسفل شاشة العرض.</p>
        </div>

        <div class="form-group mb-4">
            <label class="small fw-bold text-muted mb-2">اسم الشاشة (المكان والوصف)</label>
            <input type="text" id="newScreenName" class="premium-input"
                placeholder="مثلاً: شاشة الاستقبال الرئيسية">
        </div>

        <button class="neon-btn w-100 py-3 mt-2" onclick="ScreensModule.submitNewScreen()" style="font-size: 16px;">
            <i class="fa-solid fa-link me-2"></i> تأكيد وإرسال الترخيص
        </button>
    </div>
</div>
